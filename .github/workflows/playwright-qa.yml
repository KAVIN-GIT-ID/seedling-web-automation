name: Playwright Tests - QA
on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Test file to run on QA'
        type: choice
        required: true
        options:
          - all
          - tests/auth/login.spec.ts
          - tests/auth/signup-validation.spec.ts
          - tests/auth/forgot-password-otp.spec.ts
          - tests/auth/dashboard/dashboard.spec.ts
          - tests/auth/seedling/share-all-channels.spec.ts
          - tests/unauth/seedling/search-charity.spec.ts
          - tests/unauth/seedling/share-all-channels.spec.ts
          - tests/auth/dashboard/donation.spec.ts
          - tests/auth/dashboard/donation-comment.spec.ts
          - tests/auth/seedling/create-seedling.spec.ts
          - tests/api/oauth-api.spec.ts
        default: 'all'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      ENV: qa
      BASE_URL: ${{ secrets.BASE_URL || 'https://qa.seedlingsocial.org' }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'kavinap@uit.ac.in' }}
      TEST_USER_PASS: ${{ secrets.TEST_USER_PASS || 'Uit@1234567890' }}
      IMAP_HOST: ${{ secrets.IMAP_HOST || 'imap.gmail.com' }}
      IMAP_PORT: ${{ secrets.IMAP_PORT || '993' }}
      IMAP_USER: ${{ secrets.IMAP_USER || secrets.TEST_USER_EMAIL || 'kavinap@uit.ac.in' }}
      IMAP_PASS: ${{ secrets.IMAP_PASS || 'yewoyvymmbjqxtus' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      TWITTER_CLIENT_ID: ${{ secrets.TWITTER_CLIENT_ID }}
      TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET }}
      TWITTER_REFRESH_TOKEN: ${{ secrets.TWITTER_REFRESH_TOKEN }}
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Get installed Playwright version
      id: playwright-version
      run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Install OS dependencies only (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
      
    - name: Determine Test Command
      id: set-command
      run: |
        COMP="${{ github.event.inputs.component }}"
        ORDERED_SPECS="tests/auth/login.spec.ts tests/auth/signup-validation.spec.ts tests/auth/forgot-password-otp.spec.ts tests/auth/dashboard/dashboard.spec.ts tests/auth/seedling/share-all-channels.spec.ts tests/unauth/seedling/search-charity.spec.ts tests/unauth/seedling/share-all-channels.spec.ts tests/auth/dashboard/donation.spec.ts tests/auth/dashboard/donation-comment.spec.ts tests/auth/seedling/create-seedling.spec.ts"
        
        if [ "$COMP" = "all" ] || [ -z "$COMP" ]; then
          CMD="npm run test:qa -- $ORDERED_SPECS --workers=1"
        else
          CMD="npm run test:qa -- $COMP"
        fi
        echo "TEST_COMMAND=$CMD" >> $GITHUB_ENV

    - name: Run Playwright tests
      run: |
        ${{ env.TEST_COMMAND }} 2>&1 | tee test-output.log
        exit ${PIPESTATUS[0]}

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-qa
        path: playwright-report/
        retention-days: 30

    - name: Deploy report to Surge
      if: ${{ !cancelled() }}
      env:
        SURGE_LOGIN: ${{ secrets.SURGE_LOGIN || 'kavinap@uit.ac.in' }}
        SURGE_TOKEN: ${{ secrets.SURGE_TOKEN || '8d9007929b91f647f65f8f3667da6ae0' }}
      run: npx surge ./playwright-report ${{ github.run_id }}-seedling-qa.surge.sh
        
    - name: Prepare Email Body
      if: ${{ !cancelled() }}
      env:
        JOB_STATUS: ${{ job.status }}
        TEST_ENV: QA
        TEST_COMPONENT: ${{ github.event.inputs.component || 'all' }}
        TEST_BRANCH: ${{ github.ref_name }}
        REPORT_URL: https://${{ github.run_id }}-seedling-qa.surge.sh
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node utils/generate-email-html.js

    - name: Send email report
      if: ${{ !cancelled() }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME || secrets.TEST_USER_EMAIL || 'kavinap@uit.ac.in' }}
        password: ${{ secrets.EMAIL_PASSWORD || secrets.IMAP_PASS || 'yewoyvymmbjqxtus' }}
        subject: "Playwright QA Run ${{ job.status }} - Component: ${{ github.event.inputs.component || 'all' }}"
        to: ${{ secrets.TL_EMAIL || secrets.TEST_USER_EMAIL || 'kavinap@uit.ac.in' }}
        from: Seedling Automation <${{ secrets.EMAIL_USERNAME || secrets.TEST_USER_EMAIL || 'kavinap@uit.ac.in' }}>
        html_body: file://email-body.html
