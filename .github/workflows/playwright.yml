name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Path to the test file to run (leave empty to run all tests)'
        required: false
        default: ''
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Get installed Playwright version
      id: playwright-version
      run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Install OS dependencies only (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
    - name: Run Playwright tests
      run: npx playwright test ${{ github.event.inputs.test_file }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Send email report
      if: ${{ !cancelled() }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Playwright Run ${{ job.status }} - ${{ github.event.inputs.test_file || 'All Tests' }}"
        to: ${{ secrets.TL_EMAIL }}
        from: Seedling Automation <${{ secrets.EMAIL_USERNAME }}>
        body: |
          Playwright test run finished.

          Status: ${{ job.status }}
          Test file: ${{ github.event.inputs.test_file || 'All tests' }}
          Branch: ${{ github.ref_name }}
          Triggered by: ${{ github.actor }}
          Run link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The full HTML report is attached in the GitHub Actions artifacts (link above, under "Artifacts").
        attachments: playwright-report/index.html