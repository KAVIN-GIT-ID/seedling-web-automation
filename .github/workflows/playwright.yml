name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        type: choice
        required: true
        options:
          - qa
          - prod
        default: 'qa'
      component:
        description: 'Component to test'
        type: choice
        required: true
        options:
          - all
          - prod-suite
          - login
          - search
          - share
          - donation
          - create-seedling
        default: 'all'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Get installed Playwright version
      id: playwright-version
      run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Install OS dependencies only (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
      
    - name: Determine Test Command
      id: set-command
      run: |
        CMD="npm run test:${{ github.event.inputs.environment }}"
        COMP="${{ github.event.inputs.component }}"
        
        if [ "$COMP" = "prod-suite" ]; then
          CMD="$CMD -- --grep @prod"
        elif [ "$COMP" = "login" ]; then
          CMD="$CMD -- tests/auth/login.spec.ts"
        elif [ "$COMP" = "search" ]; then
          CMD="$CMD -- tests/unauth/seedling/search-charity.spec.ts"
        elif [ "$COMP" = "share" ]; then
          CMD="$CMD -- **/share-all-channels.spec.ts"
        elif [ "$COMP" = "donation" ]; then
          CMD="$CMD -- tests/auth/dashboard/donation.spec.ts"
        elif [ "$COMP" = "create-seedling" ]; then
          CMD="$CMD -- tests/auth/seedling/create-seedling.spec.ts"
        fi
        
        echo "TEST_COMMAND=$CMD" >> $GITHUB_ENV

    - name: Run Playwright tests
      run: ${{ env.TEST_COMMAND }}
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        TEST_USER_PASS: ${{ secrets.TEST_USER_PASS }}
        
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Send email report
      if: ${{ !cancelled() }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Playwright Run ${{ job.status }} - Env: ${{ github.event.inputs.environment }} - Component: ${{ github.event.inputs.component }}"
        to: ${{ secrets.TL_EMAIL }}
        from: Seedling Automation <${{ secrets.EMAIL_USERNAME }}>
        body: |
          Playwright test run finished.
          
          Status: ${{ job.status }}
          Environment: ${{ github.event.inputs.environment }}
          Component: ${{ github.event.inputs.component }}
          Branch: ${{ github.ref_name }}
          Triggered by: ${{ github.actor }}
          Run link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          The full HTML report is attached in the GitHub Actions artifacts (link above, under "Artifacts").
        attachments: playwright-report/index.html