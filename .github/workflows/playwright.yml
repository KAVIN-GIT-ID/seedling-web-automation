name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        type: choice
        required: true
        options:
          - qa
          - prod
        default: 'qa'
      component:
        description: 'Test file to run'
        type: choice
        required: true
        options:
          - all
          - tests/auth/login.spec.ts
          - tests/auth/dashboard/dashboard.spec.ts
          - tests/auth/dashboard/donation.spec.ts
          - tests/auth/seedling/create-seedling.spec.ts
          - tests/auth/seedling/share-all-channels.spec.ts
          - tests/unauth/seedling/search-charity.spec.ts
          - tests/unauth/seedling/share-all-channels.spec.ts
        default: 'all'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Get installed Playwright version
      id: playwright-version
      run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Install OS dependencies only (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
      
    - name: Determine Test Command
      id: set-command
      run: |
        CMD="npm run test:${{ github.event.inputs.environment }}"
        COMP="${{ github.event.inputs.component }}"
        
        if [ "$COMP" != "all" ]; then
          CMD="$CMD -- $COMP"
        fi
        
        echo "TEST_COMMAND=$CMD" >> $GITHUB_ENV

    - name: Run Playwright tests
      run: |
        ${{ env.TEST_COMMAND }} 2>&1 | tee test-output.log

    - name: Zip Playwright Report
      if: ${{ !cancelled() }}
      run: zip -r playwright-report.zip playwright-report/
        
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Deploy report to GitHub Pages
      if: ${{ !cancelled() }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        destination_dir: ${{ github.run_id }}
        
    - name: Prepare Email Body
      if: ${{ !cancelled() }}
      run: |
        REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
        REPORT_URL="https://${{ github.repository_owner }}.github.io/$REPO_NAME/${{ github.run_id }}/"
        
        echo "Playwright test run finished." > email-body.txt
        echo "Status: ${{ job.status }}" >> email-body.txt
        echo "Environment: ${{ github.event.inputs.environment }}" >> email-body.txt
        echo "Component: ${{ github.event.inputs.component }}" >> email-body.txt
        echo "Branch: ${{ github.ref_name }}" >> email-body.txt
        echo "Run link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> email-body.txt
        echo "" >> email-body.txt
        echo "VIEW INTERACTIVE HTML REPORT HERE (One-Click):" >> email-body.txt
        echo "$REPORT_URL" >> email-body.txt
        echo "" >> email-body.txt
        echo "(Note: It may take 1-2 minutes for the link to become active after the email is sent. The zip is still attached as a backup)." >> email-body.txt
        echo "" >> email-body.txt
        echo "--- TEST EXECUTION SUMMARY ---" >> email-body.txt
        tail -n 100 test-output.log >> email-body.txt

    - name: Send email report
      if: ${{ !cancelled() }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Playwright Run ${{ job.status }} - Env: ${{ github.event.inputs.environment }} - Component: ${{ github.event.inputs.component }}"
        to: ${{ secrets.TL_EMAIL }}
        from: Seedling Automation <${{ secrets.EMAIL_USERNAME }}>
        body: file://email-body.txt
        attachments: playwright-report.zip