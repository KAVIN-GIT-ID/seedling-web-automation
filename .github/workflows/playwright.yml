name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        type: choice
        required: true
        options:
          - qa
          - prod
        default: 'qa'
      component:
        description: 'Test file to run'
        type: choice
        required: true
        options:
          - all
          - tests/auth/login.spec.ts
          - tests/auth/dashboard/dashboard.spec.ts
          - tests/auth/dashboard/donation.spec.ts
          - tests/auth/seedling/create-seedling.spec.ts
          - tests/auth/seedling/share-all-channels.spec.ts
          - tests/unauth/seedling/search-charity.spec.ts
          - tests/unauth/seedling/share-all-channels.spec.ts
        default: 'all'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Get installed Playwright version
      id: playwright-version
      run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Install OS dependencies only (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
      
    - name: Determine Test Command
      id: set-command
      run: |
        CMD="npm run test:${{ github.event.inputs.environment }}"
        COMP="${{ github.event.inputs.component }}"
        
        if [ "$COMP" != "all" ]; then
          CMD="$CMD -- $COMP"
        fi
        
        echo "TEST_COMMAND=$CMD" >> $GITHUB_ENV

    - name: Run Playwright tests
      run: |
        ${{ env.TEST_COMMAND }} 2>&1 | tee test-output.log


    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Deploy report to GitHub Pages
      if: ${{ !cancelled() }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        personal_token: ${{ secrets.REPORTS_TOKEN }}
        external_repository: Kavin-uit/playwright-reports
        publish_dir: ./playwright-report
        destination_dir: ${{ github.run_id }}
        keep_files: true

    - name: Wait for GitHub Pages Deployment
      if: ${{ !cancelled() }}
      run: |
        REPORT_URL="https://Kavin-uit.github.io/playwright-reports/${{ github.run_id }}/"
        echo "Waiting for $REPORT_URL to be live..."
        for i in {1..60}; do
          STATUS_CODE=$(curl -L -o /dev/null -s -w "%{http_code}\n" "$REPORT_URL")
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "Report is live!"
            exit 0
          fi
          echo "Still waiting (Status: $STATUS_CODE). Retrying in 10s..."
          sleep 10
        done
        echo "Warning: Timeout waiting for report to be live."
        
    - name: Prepare Email Body
      if: ${{ !cancelled() }}
      run: |
        REPORT_URL="https://Kavin-uit.github.io/playwright-reports/${{ github.run_id }}/"
        
        echo "Playwright test run finished." > email-body.txt
        echo "Status: ${{ job.status }}" >> email-body.txt
        echo "Environment: ${{ github.event.inputs.environment }}" >> email-body.txt
        echo "Component: ${{ github.event.inputs.component }}" >> email-body.txt
        echo "Branch: ${{ github.ref_name }}" >> email-body.txt
        echo "Run link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> email-body.txt
        echo "" >> email-body.txt
        echo "VIEW INTERACTIVE HTML REPORT HERE (One-Click):" >> email-body.txt
        echo "$REPORT_URL" >> email-body.txt
        echo "" >> email-body.txt

    - name: Send email report
      if: ${{ !cancelled() }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Playwright Run ${{ job.status }} - Env: ${{ github.event.inputs.environment }} - Component: ${{ github.event.inputs.component }}"
        to: ${{ secrets.TL_EMAIL }}
        from: Seedling Automation <${{ secrets.EMAIL_USERNAME }}>
        body: file://email-body.txt