name: Playwright Tests - PROD
on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Test file to run on PROD'
        type: choice
        required: true
        options:
          - all (runs all read-only tests)
          - tests/auth/login.spec.ts
          - tests/auth/seedling/share-all-channels.spec.ts
          - tests/unauth/seedling/search-charity.spec.ts
          - tests/unauth/seedling/share-all-channels.spec.ts
          - tests/api/oauth-api.spec.ts
        default: 'all (runs all read-only tests)'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      ENV: prod
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      TWITTER_CLIENT_ID: ${{ secrets.TWITTER_CLIENT_ID }}
      TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET }}
      TWITTER_REFRESH_TOKEN: ${{ secrets.TWITTER_REFRESH_TOKEN }}
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Get installed Playwright version
      id: playwright-version
      run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Install OS dependencies only (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
      
    - name: Determine Test Command
      id: set-command
      run: |
        COMP="${{ github.event.inputs.component }}"
        PROD_ALL_TESTS="tests/auth/login.spec.ts tests/auth/seedling/share-all-channels.spec.ts tests/unauth/seedling/search-charity.spec.ts tests/unauth/seedling/share-all-channels.spec.ts tests/api/oauth-api.spec.ts"
        
        if [ "$COMP" = "all (runs all read-only tests)" ] || [ "$COMP" = "all (runs all 4 read-only tests)" ]; then
          CMD="npm run test:prod -- $PROD_ALL_TESTS"
        else
          CMD="npm run test:prod -- $COMP"
        fi
        
        echo "TEST_COMMAND=$CMD" >> $GITHUB_ENV

    - name: Run Playwright tests
      run: |
        ${{ env.TEST_COMMAND }} 2>&1 | tee test-output.log
        exit ${PIPESTATUS[0]}

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-prod
        path: playwright-report/
        retention-days: 30

    - name: Deploy report to Surge
      if: ${{ !cancelled() }}
      env:
        SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
        SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      run: npx surge ./playwright-report ${{ github.run_id }}-seedling-prod.surge.sh
        
    - name: Prepare Email Body
      if: ${{ !cancelled() }}
      env:
        JOB_STATUS: ${{ job.status }}
        TEST_ENV: PROD
        TEST_COMPONENT: ${{ github.event.inputs.component || 'all' }}
        TEST_BRANCH: ${{ github.ref_name }}
        REPORT_URL: https://${{ github.run_id }}-seedling-prod.surge.sh
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node utils/generate-email-html.js

    - name: Send email report
      if: ${{ !cancelled() }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Playwright PROD Run ${{ job.status }} - Component: ${{ github.event.inputs.component || 'all' }}"
        to: ${{ secrets.TL_EMAIL }}
        from: Seedling Automation <${{ secrets.EMAIL_USERNAME }}>
        html_body: file://email-body.html
